<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow p-4">
        <h3 class="text-center mb-3">Login</h3>
        <form action="/login" method="POST">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control" placeholder="Nome de usuário">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" name="email" class="form-control" placeholder="seuemail@exemplo.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" placeholder="********">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-center mt-3">
          Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
