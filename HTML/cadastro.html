     <!-- Navbar -->

          type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"

            class="navbar-toggler-icon"></span> </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

  </div>
        <div class="container my-5">
            <h2 class="text-center mb-4">Cadastro de Usuário</h2>

            <form id="FormCadastro" class="row g-3">
                <input type="hidden" id="cadastroId">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control" placeholder="Nome completo">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email" class="form-control" placeholder="Email">
                </div>
                <div class="col-md-6">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" id="Telefone" class="form-control" placeholder="(xx) xxxxx-xxxx">
                </div>
                <div class="col-md-6">
                    <label for="pet" class="form-label">Nome do Pet</label>
                    <input type="text" id="nome" class="form-control" placeholder="Nome do pet">
                </div>

                <div class=""col-12 text-center">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="reset" class="btn btn-secondary">Limpar</button>
                </div>
            </form>
            </div>
            <!-- Tabela -->
    <h3 class="text-center mt-5">Lista de Cadastros</h3>
        <table class="table table-striped mt-3">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Pet</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="listaCadastros">
                <!-- preenchido via JS-->
            </tbody>
        </table>
